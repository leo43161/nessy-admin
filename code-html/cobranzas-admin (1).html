<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FinAdmin — Panel de Cobranzas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1A6FE8;
    --primary-light: #4B93F5;
    --primary-dark: #0F4DB5;
    --sky: #38BDF8;
    --sky-light: #BAE6FD;
    --sky-pale: #F0F9FF;
    --accent: #0EA5E9;
    --surface: #FFFFFF;
    --surface-2: #F8FAFF;
    --surface-3: #EEF4FF;
    --border: #DBEAFE;
    --border-strong: #BFDBFE;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --text-on-primary: #FFFFFF;
    --green: #10B981;
    --green-bg: #ECFDF5;
    --green-border: #A7F3D0;
    --yellow: #F59E0B;
    --yellow-bg: #FFFBEB;
    --yellow-border: #FDE68A;
    --red: #EF4444;
    --red-bg: #FEF2F2;
    --red-border: #FECACA;
    --orange: #F97316;
    --orange-bg: #FFF7ED;
    --orange-border: #FED7AA;
    --gray: #64748B;
    --gray-bg: #F1F5F9;
    --gray-border: #CBD5E1;
    --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
    --shadow-md: 0 4px 16px rgba(26,111,232,0.08), 0 2px 6px rgba(15,23,42,0.05);
    --shadow-lg: 0 10px 40px rgba(26,111,232,0.12), 0 4px 12px rgba(15,23,42,0.06);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --font-mono: 'Space Mono', monospace;
    --font-main: 'DM Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; -webkit-text-size-adjust: 100%; }
  body { font-family: var(--font-main); background: var(--surface-2); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
  .topbar { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1.5px solid var(--border); box-shadow: var(--shadow-md); }
  .topbar-main { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
  .app-logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, var(--primary), var(--sky)); border-radius: 9px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(26,111,232,0.3); }
  .logo-icon svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .app-name { font-size: 1.05rem; font-weight: 700; color: var(--primary-dark); letter-spacing: -0.02em; }
  .app-name span { color: var(--sky); }
  .topbar-date-section { padding: 0 16px 12px; }
  .date-toggle-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .date-mode-btn { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border-strong); background: transparent; color: var(--text-secondary); font-family: var(--font-main); font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: all 0.18s; }
  .date-mode-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
  .date-inputs { display: flex; gap: 8px; align-items: center; }
  .date-inputs input { flex: 1; padding: 7px 11px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong); background: var(--surface-3); color: var(--text-primary); font-family: var(--font-main); font-size: 0.82rem; font-weight: 500; outline: none; transition: border-color 0.18s; }
  .date-inputs input:focus { border-color: var(--primary); }
  .date-separator { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
  .range-only { display: none; }
  .tab-nav { display: flex; background: var(--surface); border-bottom: 2px solid var(--border); padding: 0 8px; gap: 2px; overflow-x: auto; }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-btn { flex: 1; min-width: 80px; padding: 10px 8px 9px; border: none; background: transparent; color: var(--text-muted); font-family: var(--font-main); font-size: 0.78rem; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; border-bottom: 2.5px solid transparent; margin-bottom: -2px; transition: all 0.18s; white-space: nowrap; }
  .tab-btn .tab-icon { font-size: 1.1rem; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
  .main-content { padding: 0 0 90px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; }
  .section-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
  .section-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: 1px; }
  .badge-count { background: var(--primary); color: white; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; font-family: var(--font-mono); }
  .kanban-scroll { display: flex; gap: 12px; padding: 4px 16px 16px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .kanban-scroll::-webkit-scrollbar { height: 4px; }
  .kanban-scroll::-webkit-scrollbar-track { background: var(--surface-3); border-radius: 2px; }
  .kanban-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
  .kanban-col { min-width: 265px; max-width: 285px; background: var(--surface); border-radius: var(--radius-lg); border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); scroll-snap-align: start; flex-shrink: 0; }
  .col-header { padding: 14px 14px 10px; border-bottom: 1.5px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--surface-3); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .col-avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: white; flex-shrink: 0; }
  .col-info { flex: 1; min-width: 0; }
  .col-name { font-size: 0.88rem; font-weight: 700; color: var(--text-primary); }
  .col-total { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; color: var(--primary-dark); margin-top: 1px; }
  .col-stats { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
  .col-stat { font-size: 0.65rem; font-weight: 600; padding: 2px 6px; border-radius: 5px; }
  .col-cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .pay-card { border-radius: var(--radius-md); border: 1.5px solid; padding: 11px 12px; position: relative; transition: transform 0.15s, box-shadow 0.15s; cursor: default; }
  .pay-card:active { transform: scale(0.98); }
  .pay-card.status-paid { background: var(--green-bg); border-color: var(--green-border); }
  .pay-card.status-pending { background: var(--yellow-bg); border-color: var(--yellow-border); }
  .pay-card.status-overdue { background: var(--red-bg); border-color: var(--red-border); }
  .pay-card.status-unreachable { background: var(--orange-bg); border-color: var(--orange-border); }
  .pay-card.status-refinanced { background: var(--gray-bg); border-color: var(--gray-border); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .card-client { font-size: 0.84rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
  .card-ref { font-size: 0.66rem; color: var(--text-muted); margin-top: 2px; font-family: var(--font-mono); }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
  .status-paid .status-dot { background: var(--green); }
  .status-pending .status-dot { background: var(--yellow); }
  .status-overdue .status-dot { background: var(--red); }
  .status-unreachable .status-dot { background: var(--orange); }
  .status-refinanced .status-dot { background: var(--gray); }
  .card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .card-amount { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
  .card-actions { display: flex; gap: 5px; align-items: center; }
  .wa-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: #25D366; border-radius: 7px; border: none; cursor: pointer; text-decoration: none; flex-shrink: 0; transition: transform 0.15s, opacity 0.15s; }
  .wa-btn:active { transform: scale(0.9); opacity: 0.85; }
  .wa-btn svg { width: 15px; height: 15px; fill: white; }
  .wa-btn.sm { width: 24px; height: 24px; border-radius: 5px; }
  .wa-btn.sm svg { width: 12px; height: 12px; }
  .special-badge { font-size: 0.62rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--primary-dark); color: white; letter-spacing: 0.02em; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 3px; font-size: 0.65rem; font-weight: 600; padding: 2px 7px; border-radius: 5px; }
  .chip-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .chip-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .chip-red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .chip-orange { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-border); }
  .chip-blue { background: var(--surface-3); color: var(--primary); border: 1px solid var(--border-strong); }
  .chip-gray { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--gray-border); }
  .scroll-hint { display: flex; align-items: center; gap: 5px; padding: 2px 16px 6px; font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
  .finance-section { padding: 0 16px; }
  .global-balance { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 55%, var(--sky) 100%); border-radius: var(--radius-xl); padding: 20px 18px; margin-bottom: 16px; position: relative; overflow: hidden; }
  .global-balance::before { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; background: rgba(255,255,255,0.06); border-radius: 50%; }
  .global-balance::after { content: ''; position: absolute; bottom: -20px; left: -20px; width: 80px; height: 80px; background: rgba(255,255,255,0.04); border-radius: 50%; }
  .balance-label { font-size: 0.7rem; font-weight: 600; color: rgba(255,255,255,0.65); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .balance-total { font-family: var(--font-mono); font-size: 1.65rem; font-weight: 700; color: white; line-height: 1; margin-bottom: 16px; }
  .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .balance-item { background: rgba(255,255,255,0.1); border-radius: var(--radius-sm); padding: 10px 12px; }
  .bi-label { font-size: 0.63rem; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .bi-amount { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 700; color: white; }
  .bi-amount.negative { color: #FCA5A5; }
  .bi-amount.positive { color: #86EFAC; }
  .bi-amount.warn { color: #FDE68A; }
  .ledger-card { background: var(--surface); border-radius: var(--radius-lg); border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 12px; overflow: hidden; }
  .ledger-header { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-bottom: 1.5px solid var(--border); background: var(--surface-3); }
  .ledger-avatar { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 700; color: white; flex-shrink: 0; }
  .ledger-info { flex: 1; }
  .ledger-name { font-size: 0.9rem; font-weight: 700; color: var(--text-primary); }
  .ledger-deliver { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 700; color: var(--primary-dark); }
  .deliver-label { font-size: 0.63rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
  .ledger-rows { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .ledger-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: var(--radius-sm); font-size: 0.78rem; gap: 4px; }
  .ledger-row.own { background: var(--green-bg); }
  .ledger-row.cross { background: var(--sky-pale); }
  .ledger-row.overdue { background: var(--red-bg); }
  .ledger-row.unreachable { background: var(--orange-bg); }
  .lr-client { font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lr-tag { font-size: 0.6rem; font-weight: 700; padding: 2px 5px; border-radius: 4px; flex-shrink: 0; }
  .tag-own { background: var(--green-border); color: #065F46; }
  .tag-cross { background: var(--sky-light); color: #0369A1; }
  .tag-overdue { background: var(--red-border); color: #991B1B; }
  .tag-unreachable { background: var(--orange-border); color: #9A3412; }
  .lr-amount { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700; flex-shrink: 0; }
  .color-green { color: var(--green); }
  .color-red { color: var(--red); }
  .color-orange { color: var(--orange); }
  .color-blue { color: var(--primary); }
  .analytics-section { padding: 0 16px; }
  .stat-card { background: var(--surface); border-radius: var(--radius-lg); border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); padding: 16px; margin-bottom: 12px; }
  .stat-card-title { font-size: 0.73rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .stat-card-title::before { content: ''; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; flex-shrink: 0; }
  .perf-row { margin-bottom: 16px; }
  .perf-row:last-child { margin-bottom: 0; }
  .perf-row-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .perf-name { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; font-weight: 700; color: var(--text-primary); }
  .perf-mini-avatar { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; color: white; flex-shrink: 0; }
  .perf-pct { font-family: var(--font-mono); font-size: 0.88rem; font-weight: 700; color: var(--primary); }
  .progress-bar-track { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; margin-bottom: 5px; }
  .progress-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--primary), var(--sky)); }
  .perf-breakdown { display: flex; gap: 10px; flex-wrap: wrap; }
  .pb-item { display: flex; align-items: center; gap: 4px; font-size: 0.67rem; color: var(--text-secondary); font-weight: 500; }
  .pb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .status-summary { display: flex; flex-wrap: wrap; gap: 7px; }
  .ss-pill { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid; flex: 1; min-width: 90px; }
  .ss-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ss-info { flex: 1; }
  .ss-label { font-size: 0.63rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
  .ss-count { font-family: var(--font-mono); font-size: 1rem; font-weight: 700; line-height: 1.1; }
  .cross-table { width: 100%; border-collapse: collapse; }
  .cross-table th { font-size: 0.63rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 8px; text-align: left; border-bottom: 1.5px solid var(--border); }
  .cross-table td { padding: 8px 8px; font-size: 0.76rem; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  .cross-table tr:last-child td { border-bottom: none; }
  .cross-table td.mono { font-family: var(--font-mono); font-weight: 700; color: var(--primary); }
  .no-data { text-align: center; padding: 30px 20px; color: var(--text-muted); }
  .no-data-icon { font-size: 2.2rem; margin-bottom: 8px; }
  .no-data-text { font-size: 0.82rem; font-weight: 500; }
  .today-badge-pill { background: var(--surface-3); border: 1.5px solid var(--border-strong); border-radius: 20px; padding: 3px 10px; font-size: 0.72rem; color: var(--primary-dark); font-weight: 600; }
  @media (min-width: 600px) {
    .kanban-col { min-width: 300px; }
    .balance-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-main">
    <div class="app-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div class="app-name">Fin<span>Admin</span></div>
    </div>
    <div style="flex:1"></div>
    <div class="today-badge-pill" id="todayBadge"></div>
  </div>
  <div class="topbar-date-section">
    <div class="date-toggle-row">
      <button class="date-mode-btn active" id="btnSingle" onclick="setDateMode('single')">Día</button>
      <button class="date-mode-btn" id="btnRange" onclick="setDateMode('range')">Rango</button>
    </div>
    <div class="date-inputs">
      <input type="date" id="dateSingle" onchange="renderAll()">
      <span class="date-separator range-only" id="rangeSep">→</span>
      <input type="date" id="dateEnd" class="range-only" onchange="renderAll()">
    </div>
  </div>
</div>

<div class="tab-nav">
  <button class="tab-btn active" id="tabBtnOperations" onclick="switchTab('operations',this)">
    <span class="tab-icon">📋</span>Operaciones
  </button>
  <button class="tab-btn" id="tabBtnFinancial" onclick="switchTab('financial',this)">
    <span class="tab-icon">💰</span>Cierre
  </button>
  <button class="tab-btn" id="tabBtnAnalytics" onclick="switchTab('analytics',this)">
    <span class="tab-icon">📊</span>Análisis
  </button>
</div>

<div class="main-content">
  <div class="tab-panel active" id="tab-operations">
    <div class="section-header">
      <div>
        <div class="section-title">Tareas del Día</div>
        <div class="section-subtitle" id="opsSubtitle"></div>
      </div>
      <div class="badge-count" id="opsTotalBadge">0</div>
    </div>
    <div class="scroll-hint" style="color:var(--text-muted)">← Deslizá entre cobradores →</div>
    <div class="kanban-scroll" id="kanbanContainer"></div>
  </div>

  <div class="tab-panel" id="tab-financial">
    <div class="section-header">
      <div>
        <div class="section-title">Cierre de Caja</div>
        <div class="section-subtitle" id="finSubtitle"></div>
      </div>
    </div>
    <div class="finance-section">
      <div class="global-balance">
        <div class="balance-label">Total Esperado del Período</div>
        <div class="balance-total" id="balExpected">$0</div>
        <div class="balance-grid" id="balGrid"></div>
      </div>
      <div id="ledgersContainer"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-analytics">
    <div class="section-header">
      <div>
        <div class="section-title">Rendimiento del Equipo</div>
        <div class="section-subtitle">Análisis histórico completo</div>
      </div>
    </div>
    <div class="analytics-section">
      <div class="stat-card">
        <div class="stat-card-title">Distribución Global de Estados</div>
        <div class="status-summary" id="statusSummary"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-title">Tasa de Éxito por Cobrador</div>
        <div id="perfContainer"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-title">Cobros Cruzados (Apoyo)</div>
        <div id="crossContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>

const COB_COLORS = ['#1A6FE8','#0891B2','#7C3AED'];

function fmt(n) {
  return '$' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function getClientById(id) { return clientes.find(c => c.id === id); }
function getCobradorById(id) { return cobradores.find(c => c.id === id); }
function getScheduleById(id) { return payment_schedules.find(s => s.id === id); }
function getInitials(name) { return name.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase(); }
function statusLabel(s) { return {Paid:'Cobrado',Pending:'Pendiente',Overdue:'Vencido',Unreachable:'Sin Contacto',Refinanced:'Refinanciado'}[s] || s; }
function statusClass(s) { return {Paid:'status-paid',Pending:'status-pending',Overdue:'status-overdue',Unreachable:'status-unreachable',Refinanced:'status-refinanced'}[s]||'status-pending'; }
function statusChipClass(s) { return {Paid:'chip-green',Pending:'chip-yellow',Overdue:'chip-red',Unreachable:'chip-orange',Refinanced:'chip-gray'}[s]||'chip-gray'; }
function getAssigneeCobrador(dp) { const s=getScheduleById(dp.payment_schedule_id); return s?s.cobrador_id:null; }

// ============================================================
// DATE CONTROL
// ============================================================
let dateMode = 'single';

function setDateMode(mode) {
  dateMode = mode;
  document.getElementById('btnSingle').classList.toggle('active', mode==='single');
  document.getElementById('btnRange').classList.toggle('active', mode==='range');
  document.querySelectorAll('.range-only').forEach(el => el.style.display = mode==='range' ? '' : 'none');
  renderAll();
}

function getDateRange() {
  const s = document.getElementById('dateSingle').value;
  const e = document.getElementById('dateEnd').value;
  if (dateMode === 'single') return { start: s, end: s };
  return { start: s, end: (e && e >= s) ? e : s };
}

function getFilteredDoPayments() {
  const { start, end } = getDateRange();
  return do_payments.filter(dp => dp.fecha_esperada >= start && dp.fecha_esperada <= end);
}

// ============================================================
// INIT
// ============================================================
function init() {
  const today = '2026-06-08';
  document.getElementById('dateSingle').value = today;
  document.getElementById('dateEnd').value = today;
  const d = new Date(today + 'T12:00:00');
  document.getElementById('todayBadge').textContent = d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
  renderAll();
}

function renderAll() { renderOperations(); renderFinancial(); renderAnalytics(); }

// ============================================================
// TAB SWITCH
// ============================================================
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

// ============================================================
// OPERATIONS
// ============================================================
function renderOperations() {
  const filtered = getFilteredDoPayments();
  const { start, end } = getDateRange();
  document.getElementById('opsSubtitle').textContent = start===end ? formatDateDisplay(start) : `${formatDateDisplay(start)} → ${formatDateDisplay(end)}`;
  document.getElementById('opsTotalBadge').textContent = filtered.length;

  const container = document.getElementById('kanbanContainer');
  if (!filtered.length) {
    container.innerHTML = `<div class="no-data" style="width:100%;padding:40px 20px"><div class="no-data-icon">📭</div><div class="no-data-text">Sin cobros para este período</div></div>`;
    return;
  }

  const sortOrder = { Overdue:0, Unreachable:1, Pending:2, Paid:3, Refinanced:4 };

  let html = '';
  cobradores.forEach((cob, idx) => {
    const cards = filtered.filter(dp => getAssigneeCobrador(dp) === cob.id);
    if (!cards.length) return;

    const paid = cards.filter(c=>c.status==='Paid').length;
    const pending = cards.filter(c=>c.status==='Pending').length;
    const overdue = cards.filter(c=>c.status==='Overdue').length;
    const unreach = cards.filter(c=>c.status==='Unreachable').length;
    const totalMonto = cards.reduce((s,c)=>s+Number(c.monto_esperado),0);
    const color = COB_COLORS[idx%COB_COLORS.length];

    const sorted = [...cards].sort((a,b)=>(sortOrder[a.status]??9)-(sortOrder[b.status]??9));

    html += `<div class="kanban-col">
      <div class="col-header">
        <div class="col-avatar" style="background:${color}">${getInitials(cob.nombre)}</div>
        <div class="col-info">
          <div class="col-name">${cob.nombre}</div>
          <div class="col-total">${fmt(totalMonto)} esperado</div>
          <div class="col-stats">
            ${paid?`<span class="col-stat chip-green">${paid}✓</span>`:''}
            ${pending?`<span class="col-stat chip-yellow">${pending}⏳</span>`:''}
            ${overdue?`<span class="col-stat chip-red">${overdue}⚠</span>`:''}
            ${unreach?`<span class="col-stat chip-orange">${unreach}📵</span>`:''}
          </div>
        </div>
      </div>
      <div class="col-cards">`;

    sorted.forEach(dp => {
      const schedule = getScheduleById(dp.payment_schedule_id);
      const client = schedule ? getClientById(schedule.clienteId) : null;
      if (!client) return;
      const isSpecial = dp.special_case_cobrador_id != null;
      const specialCob = isSpecial ? getCobradorById(dp.special_case_cobrador_id) : null;
      const waLink = `https://wa.me/${client.telefono}`;
      const freq = schedule ? schedule.frecuencia : '';

      html += `<div class="pay-card ${statusClass(dp.status)}">
        <div class="card-top">
          <div>
            <div class="card-client">${client.nombre}</div>
            <div class="card-ref">Plan #${schedule.id} · ${freq} · ${dp.fecha_esperada}</div>
          </div>
          <div class="status-dot"></div>
        </div>
        <div class="card-bottom">
          <div>
            <div class="card-amount">${fmt(dp.monto_esperado)}</div>
            <div style="margin-top:4px;display:flex;gap:3px;flex-wrap:wrap">
              <span class="chip ${statusChipClass(dp.status)}">${statusLabel(dp.status)}</span>
              ${isSpecial?`<span class="special-badge">⇄ ${specialCob?specialCob.nombre:'?'}</span>`:''}
            </div>
          </div>
          <div class="card-actions">
            <a href="${waLink}" class="wa-btn" target="_blank">${WA_SVG}</a>
          </div>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html || `<div class="no-data" style="width:100%;padding:40px"><div class="no-data-text">Sin datos</div></div>`;
}

// ============================================================
// FINANCIAL
// ============================================================
function renderFinancial() {
  const filtered = getFilteredDoPayments();
  const { start, end } = getDateRange();
  document.getElementById('finSubtitle').textContent = start===end ? formatDateDisplay(start) : `${formatDateDisplay(start)} → ${formatDateDisplay(end)}`;

  const expected = filtered.reduce((s,dp)=>s+Number(dp.monto_esperado),0);
  const collected = filtered.filter(dp=>dp.status==='Paid').reduce((s,dp)=>s+Number(dp.monto_esperado),0);
  const pendingAmt = filtered.filter(dp=>dp.status==='Pending').reduce((s,dp)=>s+Number(dp.monto_esperado),0);
  const deficit = filtered.filter(dp=>dp.status==='Overdue'||dp.status==='Unreachable').reduce((s,dp)=>s+Number(dp.monto_esperado),0);
  const pct = expected > 0 ? Math.round((collected/expected)*100) : 0;

  document.getElementById('balExpected').textContent = fmt(expected);
  document.getElementById('balGrid').innerHTML = `
    <div class="balance-item"><div class="bi-label">Cobrado</div><div class="bi-amount positive">${fmt(collected)}</div></div>
    <div class="balance-item"><div class="bi-label">Pendiente</div><div class="bi-amount warn">${fmt(pendingAmt)}</div></div>
    <div class="balance-item"><div class="bi-label">Déficit</div><div class="bi-amount negative">${fmt(deficit)}</div></div>
    <div class="balance-item"><div class="bi-label">Efectividad</div><div class="bi-amount">${pct}%</div></div>
  `;

  let ledgersHtml = '';
  cobradores.forEach((cob, idx) => {
    const color = COB_COLORS[idx%COB_COLORS.length];
    const ownPaid   = filtered.filter(dp=>getAssigneeCobrador(dp)===cob.id&&dp.status==='Paid'&&!dp.special_case_cobrador_id);
    const crossPaid = filtered.filter(dp=>dp.special_case_cobrador_id===cob.id&&dp.status==='Paid');
    const overdueItems   = filtered.filter(dp=>getAssigneeCobrador(dp)===cob.id&&dp.status==='Overdue');
    const unreachItems   = filtered.filter(dp=>getAssigneeCobrador(dp)===cob.id&&dp.status==='Unreachable');

    const totalDeliver = [...ownPaid,...crossPaid].reduce((s,dp)=>s+Number(dp.monto_esperado),0);

    if (!ownPaid.length && !crossPaid.length && !overdueItems.length && !unreachItems.length) return;

    ledgersHtml += `<div class="ledger-card">
      <div class="ledger-header">
        <div class="ledger-avatar" style="background:${color}">${getInitials(cob.nombre)}</div>
        <div class="ledger-info">
          <div class="ledger-name">${cob.nombre}</div>
          <div class="deliver-label">A Entregar</div>
        </div>
        <div style="text-align:right"><div class="ledger-deliver">${fmt(totalDeliver)}</div></div>
      </div>
      <div class="ledger-rows">`;

    ownPaid.forEach(dp => {
      const s=getScheduleById(dp.payment_schedule_id); const c=s?getClientById(s.clienteId):null;
      ledgersHtml += `<div class="ledger-row own"><span class="lr-tag tag-own">Propio</span><span class="lr-client">${c?c.nombre:'—'}</span><span class="lr-amount color-green">${fmt(dp.monto_esperado)}</span></div>`;
    });

    crossPaid.forEach(dp => {
      const s=getScheduleById(dp.payment_schedule_id); const c=s?getClientById(s.clienteId):null;
      const origCob=getCobradorById(getAssigneeCobrador(dp));
      ledgersHtml += `<div class="ledger-row cross"><span class="lr-tag tag-cross">Apoyo→${origCob?origCob.nombre:'?'}</span><span class="lr-client">${c?c.nombre:'—'}</span><span class="lr-amount color-blue">${fmt(dp.monto_esperado)}</span></div>`;
    });

    overdueItems.forEach(dp => {
      const s=getScheduleById(dp.payment_schedule_id); const c=s?getClientById(s.clienteId):null;
      const waLink=c?`https://wa.me/${c.telefono}`:'#';
      ledgersHtml += `<div class="ledger-row overdue"><span class="lr-tag tag-overdue">Vencido</span><span class="lr-client">${c?c.nombre:'—'}</span><div style="display:flex;gap:5px;align-items:center"><span class="lr-amount color-red">${fmt(dp.monto_esperado)}</span>${c?`<a href="${waLink}" class="wa-btn sm" target="_blank">${WA_SVG}</a>`:''}</div></div>`;
    });

    unreachItems.forEach(dp => {
      const s=getScheduleById(dp.payment_schedule_id); const c=s?getClientById(s.clienteId):null;
      const waLink=c?`https://wa.me/${c.telefono}`:'#';
      ledgersHtml += `<div class="ledger-row unreachable"><span class="lr-tag tag-unreachable">Sin Contacto</span><span class="lr-client">${c?c.nombre:'—'}</span><div style="display:flex;gap:5px;align-items:center"><span class="lr-amount color-orange">${fmt(dp.monto_esperado)}</span>${c?`<a href="${waLink}" class="wa-btn sm" target="_blank">${WA_SVG}</a>`:''}</div></div>`;
    });

    ledgersHtml += `</div></div>`;
  });

  document.getElementById('ledgersContainer').innerHTML = ledgersHtml || `<div class="no-data"><div class="no-data-icon">💸</div><div class="no-data-text">Sin movimientos para este período</div></div>`;
}

// ANALYTICS
// ============================================================
function renderAnalytics() {
  const allDp = do_payments;
  const counts = { Paid:0, Pending:0, Overdue:0, Unreachable:0, Refinanced:0 };
  allDp.forEach(dp => { if (counts[dp.status]!==undefined) counts[dp.status]++; });

  const ssColors = {
    Paid:       [COB_COLORS[0], '#DBEAFE'],
    Pending:    ['#F59E0B','#FFFBEB'],
    Overdue:    ['#EF4444','#FEF2F2'],
    Unreachable:['#F97316','#FFF7ED'],
    Refinanced: ['#64748B','#F1F5F9']
  };

  document.getElementById('statusSummary').innerHTML = Object.entries(counts).map(([s,c])=>{
    const [dotColor,bg]=ssColors[s];
    return `<div class="ss-pill" style="background:${bg};border-color:${dotColor}33">
      <div class="ss-dot" style="background:${dotColor}"></div>
      <div class="ss-info"><div class="ss-label">${statusLabel(s)}</div><div class="ss-count" style="color:${dotColor}">${c}</div></div>
    </div>`;
  }).join('');

  let perfHtml = '';
  cobradores.forEach((cob,idx)=>{
    const assigned = allDp.filter(dp=>getAssigneeCobrador(dp)===cob.id);
    const paidOwn  = assigned.filter(dp=>dp.status==='Paid'&&!dp.special_case_cobrador_id).length;
    const paidHelp = assigned.filter(dp=>dp.status==='Paid'&&dp.special_case_cobrador_id).length;
    const failed   = assigned.filter(dp=>dp.status==='Overdue'||dp.status==='Unreachable').length;
    const pending  = assigned.filter(dp=>dp.status==='Pending').length;
    const total    = assigned.length;
    const hitRate  = total>0?Math.round(((paidOwn+paidHelp)/total)*100):0;
    const color    = COB_COLORS[idx%COB_COLORS.length];

    perfHtml += `<div class="perf-row">
      <div class="perf-row-header">
        <div class="perf-name"><div class="perf-mini-avatar" style="background:${color}">${getInitials(cob.nombre)}</div>${cob.nombre}</div>
        <div class="perf-pct">${hitRate}%</div>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${hitRate}%"></div></div>
      <div class="perf-breakdown">
        <div class="pb-item"><div class="pb-dot" style="background:var(--green)"></div>${paidOwn} propio</div>
        ${paidHelp?`<div class="pb-item"><div class="pb-dot" style="background:var(--sky)"></div>${paidHelp} con apoyo</div>`:''}
        ${failed?`<div class="pb-item"><div class="pb-dot" style="background:var(--red)"></div>${failed} fallido</div>`:''}
        ${pending?`<div class="pb-item"><div class="pb-dot" style="background:var(--yellow)"></div>${pending} pendiente</div>`:''}
        <div class="pb-item" style="margin-left:auto;font-weight:700;color:var(--text-secondary)">${total} total</div>
      </div>
    </div>`;
  });
  document.getElementById('perfContainer').innerHTML = perfHtml;

  const crossItems = allDp.filter(dp=>dp.special_case_cobrador_id!=null&&dp.status==='Paid');
  if (!crossItems.length) {
    document.getElementById('crossContainer').innerHTML=`<div class="no-data" style="padding:16px 0"><div class="no-data-text">Sin cobros cruzados</div></div>`;
    return;
  }

  let crossHtml = `<table class="cross-table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Asignado</th><th>Cobró</th><th>Monto</th></tr></thead><tbody>`;
  crossItems.forEach(dp=>{
    const s=getScheduleById(dp.payment_schedule_id);
    const c=s?getClientById(s.clienteId):null;
    const assigned=getCobradorById(getAssigneeCobrador(dp));
    const actual=getCobradorById(dp.special_case_cobrador_id);
    crossHtml += `<tr>
      <td>${dp.fecha_esperada}</td>
      <td>${c?c.nombre:'—'}</td>
      <td>${assigned?assigned.nombre:'—'}</td>
      <td style="color:var(--primary);font-weight:700">${actual?actual.nombre:'—'}</td>
      <td class="mono">${fmt(dp.monto_esperado)}</td>
    </tr>`;
  });
  crossHtml += `</tbody></table>`;
  document.getElementById('crossContainer').innerHTML = crossHtml;
}

// ============================================================
// UTILS
// ============================================================
function formatDateDisplay(dateStr) {
  if (!dateStr) return '—';
  const [y,m,d] = dateStr.split('-');
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const date = new Date(dateStr+'T12:00:00');
  return `${days[date.getDay()]} ${d} ${months[parseInt(m)-1]}`;
}

init();
</script>
